version: 2
updates:
  # Python dependencies (uv/pip ecosystem)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      dev-tools:
        patterns: ["ruff", "mypy", "pytest*", "bandit*", "pip-audit*", "cyclonedx*"]
        dependency-type: "development"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    # Auto-merge patch-level updates when CI is green
    auto-merge: true
    versioning-strategy: increase-if-necessary

  # GitHub Actions version pins
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    auto-merge: true

  # Frontend Node/npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    auto-merge: true
    versioning-strategy: increase-if-necessary
