version: 2
updates:
  # Python dependencies (uv/pip ecosystem)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # One weekly PR for all minor+patch python bumps instead of one PR each
      python-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"
    versioning-strategy: increase-if-necessary
    ignore:
      # Majors held back deliberately — revisit one at a time, not via dependabot
      - dependency-name: "deepeval"
        update-types: ["version-update:semver-major"]
      - dependency-name: "langfuse"
        update-types: ["version-update:semver-major"]

  # GitHub Actions version pins
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions-all:
        patterns: ["*"]
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"

  # Frontend Node/npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "frontend"
    versioning-strategy: increase-if-necessary
    ignore:
      # eslint-config-next does not support eslint v10 yet; hold at v9
      - dependency-name: "eslint"
        versions: ["10.x", ">=10"]
      # Majors held back deliberately — migrations need their own branch
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-environment-jsdom"
        update-types: ["version-update:semver-major"]
