name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 2 * * *'   # 2:00 AM UTC daily (7:30 AM IST)

jobs:
  # ── Code quality ─────────────────────────────────────────────────────────────

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run mypy src/analyzer/

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run pytest tests/ -v --ignore=tests/evals

  evals-redteam:
    name: Red-team evals (always run, no LLM needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run pytest tests/evals/test_red_team.py -v --no-cov

  # ── Security scanning ────────────────────────────────────────────────────────

  sast-bandit:
    name: SAST — Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run bandit -r src/ -c pyproject.toml -ll --quiet

  sast-semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and run Semgrep
        run: |
          pip install semgrep --quiet
          semgrep scan --config p/python --config p/owasp-top-ten --error --quiet src/

  deps:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv export --frozen --no-emit-workspace --no-dev -o /tmp/requirements.txt
      - run: |
          # GHSA-xqmj-j6mv-4862: SSTI in litellm's /prompts/test HTTP endpoint.
          # CVE-2026-42208, CVE-2026-42271: litellm 1.83.0 vulnerabilities (fix: 1.83.7).
          # CVE-2026-44843: langchain-core 1.3.1 vulnerability (fix: 1.3.3).
          # CVE-2026-40217: litellm 1.83.0 vulnerability (fix: 1.83.10).
          # All litellm/langchain upgrades are blocked by llm-guard's conflicting tiktoken pin.
          # Risk is acceptable: litellm is used as a library only, proxy server never started.
          # CVE-2026-44431, CVE-2026-44432: urllib3 2.6.3 vulnerabilities (fix: 2.7.0).
          # urllib3 is a transitive dep; upgrade blocked by same dependency constraints.
          # Revisit when llm-guard releases a compatible version.
          uv run pip-audit -r /tmp/requirements.txt --progress-spinner off \
            --ignore-vuln GHSA-xqmj-j6mv-4862 \
            --ignore-vuln CVE-2026-42208 \
            --ignore-vuln CVE-2026-42271 \
            --ignore-vuln CVE-2026-44843 \
            --ignore-vuln CVE-2026-40217 \
            --ignore-vuln CVE-2026-44431 \
            --ignore-vuln CVE-2026-44432 \
            --ignore-vuln GHSA-f4xh-w4cj-qxq8 `# langsmith` \
            --ignore-vuln PYSEC-2026-388      `# litellm` \
            --ignore-vuln CVE-2026-47102      `# litellm` \
            --ignore-vuln CVE-2026-47101      `# litellm` \
            --ignore-vuln GHSA-4xgf-cpjx-pc3j `# pydantic-setting` \
            --ignore-vuln PYSEC-2026-249      `# starlette` \
            --ignore-vuln PYSEC-2026-248      `# starlette` \
            --ignore-vuln GHSA-537c-gmf6-5ccf `# cryptography` \

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so gitleaks sees all commits on the branch
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Integration tests (moto — fake AWS) ──────────────────────────────────────

  integration-aws:
    name: Integration tests (moto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run pytest tests/integration/ -v --no-cov

  # ── API contract testing (schemathesis) ───────────────────────────────────────

  contract-api:
    name: API contract (schemathesis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --dev
      - name: Start API server
        run: |
          uv run uvicorn analyzer.api.app:app --host 0.0.0.0 --port 8000 &
          # Wait for server to be ready
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/api/v1/health && break || sleep 1
          done
        env:
          TELEGRAM_BOT_TOKEN: "test-token"
          ENVIRONMENT: "test"
      - name: Validate OpenAPI schema
        run: |
          uv run schemathesis run http://localhost:8000/openapi.json \
            --checks=not_a_server_error \
            --phases=examples

  # ── Terraform CI ──────────────────────────────────────────────────────────────

  terraform-ci:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.8"
      - name: Terraform format check
        run: terraform fmt -check -recursive terraform/
      - name: Terraform validate (prod)
        working-directory: terraform/envs/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Install tflint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
      - name: tflint modules
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Nightly drift detection ───────────────────────────────────────────────────

  drift-detection:
    name: Terraform drift detection
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.8"
      - name: Check prod for drift
        working-directory: terraform/envs/prod
        run: |
          terraform init -input=false
          terraform plan -detailed-exitcode -input=false || \
            (echo "::warning::Drift detected in prod — review terraform plan output" && exit 0)

  # ── Docker images ─────────────────────────────────────────────────────────────

  build-api-image:
    name: Build API image (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API Lambda image
        run: docker build -t indian-stock-analyzer:ci .

  container-scan:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-api-image
    steps:
      - uses: actions/checkout@v4
      - name: Build API image for scanning
        run: docker build -t indian-stock-analyzer:scan .
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: indian-stock-analyzer:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true  # skip CVEs with no available fix
          trivyignores: .trivyignore

  # Pipeline image is heavy (~10 min with torch). Build only on merges to main/dev.
  build-pipeline-image:
    name: Build pipeline image (Dockerfile.pipeline)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build ECS Fargate pipeline image
        run: docker build -f Dockerfile.pipeline -t indian-stock-analyzer-pipeline:ci .

  # ── Nightly golden evals ──────────────────────────────────────────────────────

  evals-golden-nightly:
    name: Golden evals (nightly — full LLM pipeline + Braintrust)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run pytest tests/evals/test_golden.py -v --no-cov

  # ── SBOM artifact ─────────────────────────────────────────────────────────────

  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv export --frozen --no-emit-workspace --no-dev -o /tmp/requirements.txt
      - run: uv run cyclonedx-py requirements /tmp/requirements.txt --of json > sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 90
