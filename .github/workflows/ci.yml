name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 2 * * *'   # 2:00 AM UTC daily (7:30 AM IST)

jobs:
  # ── Code quality ─────────────────────────────────────────────────────────────

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run mypy src/analyzer/

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run pytest tests/ -v --ignore=tests/evals

  evals-redteam:
    name: Red-team evals (always run, no LLM needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run pytest tests/evals/test_red_team.py -v --no-cov

  # ── Security scanning ────────────────────────────────────────────────────────

  sast-bandit:
    name: SAST — Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run bandit -r src/ -c pyproject.toml -ll --quiet

  sast-semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and run Semgrep
        run: |
          pip install semgrep --quiet
          semgrep scan --config p/python --config p/owasp-top-ten --error --quiet src/

  deps:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv export --frozen --no-emit-workspace --no-dev -o /tmp/requirements.txt
      - run: |
          # GHSA-xqmj-j6mv-4862: SSTI in litellm's /prompts/test HTTP endpoint.
          # We use litellm as a library only — the proxy server is never started.
          # Upgrading is blocked by llm-guard's conflicting tiktoken pin.
          uv run pip-audit -r /tmp/requirements.txt --progress-spinner off \
            --ignore-vuln GHSA-xqmj-j6mv-4862

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so gitleaks sees all commits on the branch
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Docker images ─────────────────────────────────────────────────────────────

  build-api-image:
    name: Build API image (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API Lambda image
        run: docker build -t indian-stock-analyzer:ci .

  container-scan:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-api-image
    steps:
      - uses: actions/checkout@v4
      - name: Build API image for scanning
        run: docker build -t indian-stock-analyzer:scan .
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: indian-stock-analyzer:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true  # skip CVEs with no available fix
          trivyignore-file: .trivyignore

  # Pipeline image is heavy (~10 min with torch). Build only on merges to main/dev.
  build-pipeline-image:
    name: Build pipeline image (Dockerfile.pipeline)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build ECS Fargate pipeline image
        run: docker build -f Dockerfile.pipeline -t indian-stock-analyzer-pipeline:ci .

  # ── Nightly golden evals ──────────────────────────────────────────────────────

  evals-golden-nightly:
    name: Golden evals (nightly — full LLM pipeline + Braintrust)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run pytest tests/evals/test_golden.py -v --no-cov

  # ── SBOM artifact ─────────────────────────────────────────────────────────────

  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv export --frozen --no-emit-workspace --no-dev -o /tmp/requirements.txt
      - run: uv run cyclonedx-py requirements /tmp/requirements.txt --of json > sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 90
