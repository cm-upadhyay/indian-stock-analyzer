[project]
name = "indian-stock-analyzer"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = [
    # Data
    "yfinance>=0.2",
    "pandas>=2.0",
    "ta>=0.11",
    "requests>=2.31",
    "boto3>=1.34",
    # LLM + orchestration
    "openai>=1.0",
    "litellm>=1.83.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-aws>=1.0",
    "langsmith>=0.8.0",
    # Models + validation
    "pydantic>=2.0",
    "pydantic-settings[yaml]>=2.2",
    "pyyaml>=6.0",
    "Jinja2>=3.1",
    # Reliability
    "tenacity>=8.2",
    "pybreaker>=1.0",
    # Observability
    "structlog>=24.0",
    # API
    "fastapi>=0.111",
    "mangum>=0.17",
    "uvicorn[standard]>=0.49.0",
    "slowapi>=0.1.9",
    # Delivery
    "python-telegram-bot>=21.0",
    # Env
    "python-dotenv>=1.2.2",
    # Task 3.7 — DataFrame validation (pure Python, Lambda-safe)
    "pandera>=0.20",
    # Task 3.3/3.4 — MCP server + tools
    "mcp>=1.0",
    # Phase 3B — Do First 2: Qdrant Cloud (replaces local ChromaDB on Lambda)
    "qdrant-client>=1.7",
    # Phase 3B — Do First 3: Tavily macro-news MCP tool
    "tavily-python>=0.3",
    # Phase 3B — Task 3.14: Observability (all lightweight HTTP clients / pure Python)
    "langfuse>=2.0",
    "sentry-sdk>=2.0",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "aiohttp>=3.14.0",
    "cryptography>=46.0.6",
    "python-jose[cryptography]>=3.3",
    "pyjwt>=2.13.0",
    "starlette>=1.0.1",
    "idna>=3.15",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[dependency-groups]
# local = heavy packages excluded from the API Lambda image (--no-group local in Dockerfile).
# These run on the ECS Fargate pipeline image (Dockerfile.pipeline uses --group local).
# All have graceful ImportError fallbacks so they degrade silently if somehow absent.
local = [
    # Task 3.1 — Hierarchical memory (chromadb needs cmake/gcc to compile hnswlib)
    "mem0ai>=0.1",
    "chromadb>=0.5",
    # Task 3.9 — guardrails-ai removed from PyPI; replacement package 'guardrails' pins
    # old pytest-cov versions that conflict with dev group. Feature degrades gracefully.
    # Task 3.10 — Policy-level guardrails (heavy transitive deps)
    "nemoguardrails>=0.9",
    # Task 3.12 — Input security (llm-guard pulls torch ~2 GB)
    "llm-guard>=0.3",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
    "types-requests>=2.31",
    "boto3-stubs[s3]>=1.34",
    "deepeval>=3.4.6",
    # Phase 3B — Task 3.13: CI security scanners (local + CI only, not Lambda)
    "bandit[toml]>=1.7",
    "pip-audit>=2.0",
    "cyclonedx-bom>=4.0",
    # Phase 4 — Task 4.14: integration tests + contract testing
    "moto[s3,dynamodb,ssm,sns]>=5.0",
    "schemathesis>=3.25",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyzer", "src/mcp_server"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TC"]
ignore = [
    "E501",   # line too long — handled by formatter
    "TC001",  # Pydantic models are used at runtime, not just annotations
    "TC002",  # same — third-party runtime types (pandas DataFrame)
    "TC003",  # same — stdlib types used at runtime
]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["notebooks/", "tests/"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/analyzer --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["src/analyzer"]
# Omit modules that require external API calls — tested via integration tests, not unit tests
omit = [
    "src/analyzer/adapters/*",
    "src/analyzer/pipeline/*",
    "src/analyzer/api/*",
    "src/analyzer/notify/*",
    "src/analyzer/screener.py",
    "src/analyzer/__main__.py",
    "src/analyzer/data/fetcher.py",
    "src/analyzer/data/corporate.py",
    "src/analyzer/data/news.py",
    "src/analyzer/data/market_overview.py",
    "src/analyzer/data/global_cues.py",
    "src/analyzer/llm/analyst.py",
    "src/analyzer/llm/morning.py",
    "src/analyzer/llm/prompt_library.py",
    "src/analyzer/utils/reliability.py",
    "src/analyzer/utils/storage.py",
    "src/analyzer/utils/logging.py",
    # Phase 3A — omit modules that require external services (Mem0, NeMo, LLM Guard)
    "src/analyzer/memory/store.py",
    "src/analyzer/guardrails/nemo_rails/rails.py",
    "src/analyzer/security/input_guard.py",
    "src/analyzer/hitl/approver.py",
    "src/analyzer/llm/agent.py",
    "src/analyzer/llm/reviewer.py",
    "src/analyzer/outcomes/tracker.py",
    "src/mcp_server/*",
    # Phase 3B — omit observability modules (require Langfuse/Sentry/OTel credentials)
    "src/analyzer/observability/*",
    # Phase 3C — omit modules requiring external services (DynamoDB, Qdrant, flag YAML)
    "src/analyzer/flags/*",
    "src/analyzer/users/*",
    "src/analyzer/utils/cache.py",
]

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", ".venv"]
skips = [
    "B101",  # assert_used — asserts are fine in application code for invariants
    "B311",  # random — used for non-cryptographic sampling/selection only
    "B108",  # hardcoded_tmp_directory — /tmp/data/ is intentional: Lambda root fs is read-only
]
