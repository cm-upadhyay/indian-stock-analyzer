[project]
name = "indian-stock-analyzer"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
    # Data
    "yfinance>=0.2",
    "pandas>=2.0",
    "ta>=0.11",
    "requests>=2.31",
    "boto3>=1.34",
    # LLM + orchestration
    "openai>=1.0",
    "litellm>=1.40",
    "langgraph>=0.2",
    "langsmith>=0.1",
    # Models + validation
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "Jinja2>=3.1",
    # Reliability
    "tenacity>=8.2",
    "pybreaker>=1.0",
    # Observability
    "structlog>=24.0",
    # API
    "fastapi>=0.111",
    "mangum>=0.17",
    "uvicorn[standard]>=0.29",
    # Delivery
    "python-telegram-bot>=21.0",
    # Search
    "tavily-python>=0.3",
    # Env
    "python-dotenv>=1.0",
    # Task 3.7 — DataFrame validation (pure Python, Lambda-safe)
    "pandera>=0.20",
    # Task 3.3/3.4 — MCP server + tools
    "mcp>=1.0",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[dependency-groups]
# local = heavy packages that run locally only — excluded from Lambda via --no-group local.
# All have graceful ImportError fallbacks so the pipeline degrades silently when absent.
local = [
    # Task 3.1 — Hierarchical memory (chromadb needs cmake/gcc to compile hnswlib)
    "mem0ai>=0.1",
    "chromadb>=0.5",
    # Task 3.9 — Schema-level guardrails
    "guardrails-ai>=0.5",
    # Task 3.10 — Policy-level guardrails (heavy transitive deps)
    "nemoguardrails>=0.9",
    # Task 3.12 — Input security (llm-guard pulls torch ~2 GB)
    "llm-guard>=0.3",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
    "types-requests>=2.31",
    "boto3-stubs[s3]>=1.34",
    "deepeval>=3.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyzer", "src/mcp_server"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TC"]
ignore = [
    "E501",   # line too long — handled by formatter
    "TC001",  # Pydantic models are used at runtime, not just annotations
    "TC002",  # same — third-party runtime types (pandas DataFrame)
    "TC003",  # same — stdlib types used at runtime
]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["notebooks/", "tests/"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/analyzer --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["src/analyzer"]
# Omit modules that require external API calls — tested via integration tests, not unit tests
omit = [
    "src/analyzer/adapters/*",
    "src/analyzer/pipeline/*",
    "src/analyzer/api/*",
    "src/analyzer/notify/*",
    "src/analyzer/screener.py",
    "src/analyzer/__main__.py",
    "src/analyzer/data/fetcher.py",
    "src/analyzer/data/corporate.py",
    "src/analyzer/data/news.py",
    "src/analyzer/data/market_overview.py",
    "src/analyzer/data/global_cues.py",
    "src/analyzer/llm/analyst.py",
    "src/analyzer/llm/morning.py",
    "src/analyzer/llm/prompt_library.py",
    "src/analyzer/utils/reliability.py",
    "src/analyzer/utils/storage.py",
    "src/analyzer/utils/logging.py",
    # Phase 3A — omit modules that require external services (Mem0, NeMo, LLM Guard)
    "src/analyzer/memory/store.py",
    "src/analyzer/guardrails/nemo_rails/rails.py",
    "src/analyzer/security/input_guard.py",
    "src/analyzer/hitl/approver.py",
    "src/analyzer/llm/agent.py",
    "src/analyzer/llm/reviewer.py",
    "src/analyzer/outcomes/tracker.py",
    "src/mcp_server/*",
]
