# Golden eval dataset — 50 cases for regression testing the scoring + LLM pipeline.
#
# offline: true  → tests scoring/guardrails logic only, no LLM call needed, runs in CI
# offline: false → tests full LLM pipeline, needs OPENAI_API_KEY, runs nightly
#
# Each offline case drives ScoringResult directly and asserts signal/confidence.
# Each online case calls run_4pm() with mocked stock data and asserts LLM output quality.

