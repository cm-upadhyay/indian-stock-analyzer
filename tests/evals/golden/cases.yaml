# ══════════════════════════════════════════════════════════════════════════════
# GUARDRAIL validation cases (offline — test field validators)
# ══════════════════════════════════════════════════════════════════════════════

- id: golden_046
  offline: true
  category: guardrail
  description: "BUY signal but entry price 20% above current — should be corrected"
  verdict_mock:
    signal: BUY
    confidence: 0.75
    entry: 1200   # 20% above current price of 1000
    stop_loss: 950
    target: 1400
    current_price: 1000
  guardrail_should_correct: true
  guardrail_correction: "entry within 5% of current price"

- id: golden_047
  offline: true
  category: guardrail
  description: "BUY signal but stop-loss only 0.5% below entry — too tight, should fail"
  verdict_mock:
    signal: BUY
    confidence: 0.72
    entry: 1000
    stop_loss: 995   # only 0.5% below — below 2% minimum
    target: 1100
    current_price: 1000
  guardrail_should_correct: true
  guardrail_correction: "stop_loss at least 2% below entry"

- id: golden_048
  offline: true
  category: guardrail
  description: "BUY with confidence 0.45 — below minimum threshold, should be rejected"
  verdict_mock:
    signal: BUY
    confidence: 0.45
    entry: 500
    stop_loss: 480
    target: 560
    current_price: 500
  guardrail_should_correct: true
  guardrail_correction: "confidence >= 0.60 required for BUY"

- id: golden_049
  offline: true
  category: guardrail
  description: "SELL with stop-loss 15% above entry — too wide, should be corrected"
  verdict_mock:
    signal: SELL
    confidence: 0.70
    entry: 1000
    stop_loss: 1150   # 15% above entry for SELL — exceeds 8% max
    target: 800
    current_price: 1000
  guardrail_should_correct: true
  guardrail_correction: "stop_loss within 8% of entry"

- id: golden_050
  offline: true
  category: guardrail
  description: "HOLD signal with no entry/target — guardrails should pass without correction"
  verdict_mock:
    signal: HOLD
    confidence: 0.68
    entry: null
    stop_loss: null
    target: null
    current_price: 800
  guardrail_should_correct: false
